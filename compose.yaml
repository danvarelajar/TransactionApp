# Base stack: `docker compose build` | `docker compose up`
#
# Local overrides (hostname, ALLOWED_ORIGINS, extra_hosts, …) go in
# compose.override.yaml — Compose merges it automatically. See compose.override.yaml.example.
# (.gitignore skips docker-compose.yml so you can keep an optional legacy file locally.)
#
# Ports are literal here so interpolation never produces ":3000" (Compose errors with
# "invalid proto"). To remap host ports use compose.override.yaml with fixed values or
# "${PAYMENT_PORT:-3000}:3000"; never leave PAYMENT_PORT empty in `.env`.

services:
  app:
    build: ./app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000

  attacker:
    build: ./attacker
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
