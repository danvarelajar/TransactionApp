# TransactionApp — build + env from project `.env`.
# Copy `.env.example` to `.env`. Compose substitutes ${VARS} from `.env` for this file;
# `env_file` passes the same file into containers (PORT is set below so it matches listen).
#
# Prefer dynamic steal.js / script URLs: omit ATTACKER_URL unless you need a fixed fallback
# or set FORCE_ATTACKER_URL_FROM_ENV=1.
#
# Publish ports: PAYMENT_PORT / ATTACKER_PORT default to 3000 / 3001. Using 443 requires a
# host that allows Docker to bind low ports.

services:
  app:
    env_file: .env
    build: ./app
    hostname: ${PAYMENT_DOMAIN:-payment.example.com}
    ports:
      - "${PAYMENT_PORT:-3000}:${PAYMENT_INTERNAL_PORT:-3000}"
    environment:
      - PORT=${PAYMENT_INTERNAL_PORT:-3000}
    extra_hosts:
      - "${PAYMENT_DOMAIN:-payment.example.com}:127.0.0.1"
      - "${ATTACKER_DOMAIN:-attacker.example.com}:127.0.0.1"

  attacker:
    env_file: .env
    build: ./attacker
    hostname: ${ATTACKER_DOMAIN:-attacker.example.com}
    ports:
      - "${ATTACKER_PORT:-3001}:${ATTACKER_INTERNAL_PORT:-3001}"
    environment:
      - PORT=${ATTACKER_INTERNAL_PORT:-3001}
    extra_hosts:
      - "${PAYMENT_DOMAIN:-payment.example.com}:127.0.0.1"
      - "${ATTACKER_DOMAIN:-attacker.example.com}:127.0.0.1"
